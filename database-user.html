<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database User - IoT Access</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Sidebar Overlay -->
  <div id="sidebarOverlay" class="fixed inset-0 bg-black/40 z-40 hidden lg:hidden"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar fixed inset-y-0 left-0 w-64 bg-white border-r border-gray-200 z-50 -translate-x-full lg:translate-x-0">
    <div class="flex items-center justify-between h-16 px-6 border-b border-gray-100">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
          <i class="fas fa-id-card text-white text-sm"></i>
        </div>
        <span class="font-bold text-gray-800">IoT Access</span>
      </div>
      <button id="sidebarClose" class="lg:hidden text-gray-400 hover:text-gray-600"><i class="fas fa-times text-lg"></i></button>
    </div>
    <nav class="p-4 space-y-1">
      <a href="index.html" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-700 hover:bg-gray-100">
        <i class="fas fa-home w-5 text-center text-gray-400"></i> Dashboard
      </a>
      <a href="riwayat-tap.html" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-700 hover:bg-gray-100">
        <i class="fas fa-history w-5 text-center text-gray-400"></i> Riwayat Tap
      </a>
      <a href="riwayat-user.html" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-700 hover:bg-gray-100">
        <i class="fas fa-exchange-alt w-5 text-center text-gray-400"></i> Keluar Masuk
      </a>
      <a href="database-user.html" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-700 hover:bg-gray-100">
        <i class="fas fa-users w-5 text-center text-gray-400"></i> Database User
      </a>
    </nav>
  </aside>

  <!-- Edit Modal -->
  <div id="editModal" class="modal-backdrop">
    <div class="modal-content">
      <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
        <h3 class="text-lg font-semibold text-gray-800"><i class="fas fa-user-edit mr-2 text-blue-500"></i>Edit User</h3>
        <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
      </div>
      <div class="p-6">
        <form id="editForm" onsubmit="event.preventDefault(); saveEditUser();">
          <input type="hidden" id="editUid">
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">UID Kartu</label>
              <input type="text" id="editUidDisplay" class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-50 text-gray-500" readonly>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
              <input type="text" id="editNama" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">NIM</label>
              <input type="text" id="editNim" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none" required>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Fakultas</label>
                <input type="text" id="editFakultas" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none" required>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Prodi</label>
                <input type="text" id="editProdi" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none" required>
              </div>
            </div>
          </div>
          <div class="flex justify-end gap-3 mt-6">
            <button type="button" onclick="closeEditModal()" class="px-4 py-2 text-sm text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition">Batal</button>
            <button type="submit" id="btnSaveEdit" class="px-4 py-2 text-sm text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition flex items-center">
              <i class="fas fa-save mr-2"></i>Simpan Perubahan
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="lg:ml-64 min-h-screen">
    <header class="sticky top-0 z-30 bg-white/80 backdrop-blur border-b border-gray-200">
      <div class="flex items-center justify-between h-16 px-6">
        <div class="flex items-center gap-3">
          <button id="sidebarToggle" class="lg:hidden text-gray-500 hover:text-gray-700"><i class="fas fa-bars text-lg"></i></button>
          <h1 class="text-lg font-semibold text-gray-800"><i class="fas fa-database mr-2 text-cyan-500"></i>Database User</h1>
        </div>
        <button onclick="toggleAddForm()" id="btnToggleForm" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded-lg transition flex items-center shadow-sm">
          <i class="fas fa-user-plus mr-2"></i>Tambah User
        </button>
      </div>
    </header>

    <div class="p-6">
      <!-- Add User Form (collapsible) -->
      <div id="addUserSection" class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden mb-6 hidden">
        <div class="px-6 py-4 border-b border-gray-100">
          <h2 class="text-base font-semibold text-gray-700"><i class="fas fa-user-plus mr-2 text-blue-500"></i>Registrasi User Baru</h2>
        </div>
        <div class="p-6">
          <form id="userForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4" onsubmit="event.preventDefault(); addNewUser();">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">UID Kartu</label>
              <input type="text" id="addUid" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="UID Kartu" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
              <input type="text" id="addNama" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="Nama Lengkap" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">NIM</label>
              <input type="text" id="addNim" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="NIM" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Fakultas</label>
              <input type="text" id="addFakultas" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="Fakultas" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Prodi</label>
              <input type="text" id="addProdi" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="Program Studi" required>
            </div>
            <div class="lg:col-span-5 flex justify-end gap-3 mt-2">
              <button type="button" onclick="toggleAddForm()" class="px-4 py-2 text-sm text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg transition">Batal</button>
              <button type="submit" id="btnAddUser" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-5 rounded-lg transition flex items-center shadow-sm">
                <i class="fas fa-save mr-2"></i>Simpan User
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Search -->
      <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 mb-6 flex flex-wrap items-center gap-3">
        <div class="flex items-center gap-2 flex-1 min-w-[200px]">
          <i class="fas fa-search text-gray-400"></i>
          <input type="text" id="searchUser" oninput="renderUserTable()" class="w-full text-sm border-0 outline-none placeholder-gray-400" placeholder="Cari berdasarkan nama, NIM, atau UID...">
        </div>
        <div class="text-sm text-gray-400" id="userCount"></div>
      </div>

      <!-- User Table -->
      <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="min-w-full">
            <thead class="bg-gray-50">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">No</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">UID</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nama Lengkap</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">NIM</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Fakultas</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Prodi</th>
                <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase">Aksi</th>
              </tr>
            </thead>
            <tbody id="tableUsers" class="divide-y divide-gray-100">
              <tr><td colspan="7" class="px-6 py-8 text-center text-sm text-gray-400"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="px-6 py-4 border-t border-gray-100 flex justify-center" id="userPagination"></div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/database-user.js"></script>
</body>
</html>
